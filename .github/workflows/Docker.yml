name: Docker example

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build app
        run: npm run build --if-present
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab_test:latest

      - name: Bundle app and node_modules into ZIP
        run: zip -r app.zip . -x ".git/*" ".github/*" "app.zip"
        
      - name: tests
        run: npm test -- --coverage --testLocationInResults
        
      - name: Publish test and coverage report
        uses: mridang/action-test-reporter@v1
        with:
          working-directory: ./
          coverage-file: coverage/lcov.info
          
      - name: list all
        run: ls -alhR
