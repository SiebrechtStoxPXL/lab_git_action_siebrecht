name: Dependencies example

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
      - name: list all
        run: ls -alhR
