name: Complete example

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build --if-present

      - name: Bundle app and node_modules into ZIP
        run: zip -r app.zip . -x ".git/*" ".github/*" "app.zip"
      - name: test
        run: npm test
      - name: list all
        run: ls -alhR
